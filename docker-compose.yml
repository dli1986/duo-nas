services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duonas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-duonas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # loopback only, non-default host port (5432 already used by another project's container)

  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      # Short interval so a missed/incomplete boot-time scan (WSL2 filesystem bridge
      # isn't always ready the instant the container starts after a host reboot) self-heals
      # within minutes instead of requiring a manual `docker compose restart navidrome`.
      ND_SCANSCHEDULE: "@every 5m"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    ports:
      - "127.0.0.1:4533:4533" # loopback only — reach it over Tailscale, not the public internet
    volumes:
      - navidrome_data:/data
      - ${DUONAS_MUSIC_DIR:-./music}:/music:ro

# Named (Docker-managed) volumes, not host bind mounts — see README's "Local directories"
# section for why: Rancher Desktop's WSL2 integration proxies bind mounts through an
# internal path that doesn't reliably survive container restarts, silently resetting
# Postgres/Navidrome state. Named volumes are stored inside Docker's own storage instead,
# sidestepping that translation layer entirely, and work identically on real NAS hardware.
volumes:
  postgres_data:
  navidrome_data:

